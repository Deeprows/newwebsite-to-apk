name: Build Deeprows Sports TV APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;33.0.2"

      - name: Generate signing key
        run: |
          if [ ! -f app/my-release-key.jks ]; then
            keytool -genkeypair \
              -v \
              -keystore app/my-release-key.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias my \
              -storepass 123456 \
              -keypass 123456 \
              -dname "CN=Deeprows Sports TV, OU=Deeprows, O=Deeprows, L=Cairo, S=Cairo, C=EG"
          fi

      - name: Make scripts executable
        run: |
          chmod +x make.sh
          chmod +x gradlew

      - name: Build APK
        run: |
          ./make.sh build

      - name: Verify APK
        run: |
          test -f deeprows.apk
          ls -lh deeprows.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deeprows-sports-tv-apk
          path: deeprows.apk
          if-no-files-found: error
