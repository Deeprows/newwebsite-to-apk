name: Build Deeprows Sports TV APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;33.0.2"

      - name: Prepare local Android SDK
        run: |
          mkdir -p cmdline-tools/latest

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-tools

          cp -r /tmp/android-tools/cmdline-tools/* cmdline-tools/latest/

          mkdir -p cmdline-tools/platform-tools
          mkdir -p cmdline-tools/platforms
          mkdir -p cmdline-tools/build-tools

          cp -r "$ANDROID_HOME/platform-tools/"* cmdline-tools/platform-tools/
          cp -r "$ANDROID_HOME/platforms/"* cmdline-tools/platforms/
          cp -r "$ANDROID_HOME/build-tools/"* cmdline-tools/build-tools/

      - name: Make scripts executable
        run: |
          chmod +x make.sh
          chmod +x gradlew

      - name: Build APK
        run: ./make.sh build

      - name: Find APK
        run: find . -name "*.apk" -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deeprows-sports-tv-apk
          path: "**/*.apk"
          if-no-files-found: error
